[project]
name = "starrag"
version = "0.1.0"
description = "Star a git repo and chat with it via RAG."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.4.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-huggingface>=0.1.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "tqdm>=4.66.0",
]

[project.scripts]
starrag = "main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["starrag", "main.py"]
